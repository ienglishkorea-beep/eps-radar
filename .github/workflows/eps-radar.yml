name: EPS Radar Daily Summary

on:
  workflow_dispatch:
  schedule:
    - cron: "10 22 * * 1-5"

jobs:
  run-eps-radar:
    runs-on: ubuntu-latest

    env:
      TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      DEBUG_TIINGO: "1"
      DEBUG_TIINGO_SAMPLE_TICKERS: "MSFT,NVDA"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests lxml html5lib beautifulsoup4

      - name: Run EPS Radar
        run: |
          python eps_radar.py > eps_radar_run.log 2>&1
          cat eps_radar_run.log

      - name: Send EPS Daily Telegram Summary
        if: always()
        run: |
          python - <<'PY'
          import os
          import math
          import pandas as pd
          import requests

          bot_token = os.getenv("TELEGRAM_BOT_TOKEN", "").strip()
          chat_id = os.getenv("TELEGRAM_CHAT_ID", "").strip()

          if not bot_token or not chat_id:
              print("Telegram secrets missing. Skip telegram.")
              raise SystemExit(0)

          def fmt_pct(x):
              try:
                  if x is None or (isinstance(x, float) and math.isnan(x)):
                      return "-"
                  return f"{float(x)*100:.1f}%"
              except Exception:
                  return "-"

          def fmt_num(x, digits=2):
              try:
                  if x is None or (isinstance(x, float) and math.isnan(x)):
                      return "-"
                  return f"{float(x):.{digits}f}"
              except Exception:
                  return "-"

          def send_message(text: str):
              url = f"https://api.telegram.org/bot{bot_token}/sendMessage"
              payload = {
                  "chat_id": chat_id,
                  "text": text,
              }
              r = requests.post(url, data=payload, timeout=30)
              print("telegram status:", r.status_code)
              print(r.text[:500])

          summary_lines = []

          try:
              with open("eps_radar_run.log", "r", encoding="utf-8") as f:
                  run_log = f.read()
          except Exception:
              run_log = ""

          summary_lines.append("EPS Radar Daily Summary")
          summary_lines.append("")

          if run_log:
              for line in run_log.splitlines():
                  line = line.strip()
                  if (
                      line.startswith("Universe tickers:")
                      or line.startswith("SPY 6M return:")
                      or line.startswith("SPY 3M return:")
                      or line.startswith("Stage0 shortlist:")
                      or line.startswith("Stage0 shortlist relaxed:")
                      or line.startswith("Stage1 proxy passed:")
                      or line.startswith("Final candidates:")
                      or line.startswith("Ultra candidates:")
                      or line.startswith("Multibagger candidates:")
                      or line.startswith("No final candidates")
                      or line.startswith("SPY fetch failed.")
                      or line.startswith("Diagnostics")
                      or line.startswith("price_history_missing_count:")
                      or line.startswith("quote_missing_count:")
                      or line.startswith("summary_missing_count:")
                      or line.startswith("market_cap_present_count:")
                      or line.startswith("sector_present_count:")
                      or line.startswith("industry_present_count:")
                      or line.startswith("revenue_growth_present_count:")
                      or line.startswith("gross_margin_present_count:")
                      or line.startswith("operating_margin_present_count:")
                      or line.startswith("stage0_price_below_min:")
                      or line.startswith("stage0_avg_dollar_volume_below_min:")
                      or line.startswith("stage0_trend_filter_fail:")
                      or line.startswith("stage0_rs_filter_fail:")
                      or line.startswith("stage0_high_proximity_fail:")
                      or line.startswith("market_cap_missing:")
                      or line.startswith("market_cap_below_min:")
                      or line.startswith("sector_missing:")
                      or line.startswith("industry_missing:")
                      or line.startswith("sector_etf_missing:")
                      or line.startswith("sector_return_missing:")
                      or line.startswith("revenue_growth_missing:")
                      or line.startswith("revenue_growth_below_min:")
                      or line.startswith("high_proximity_below_min:")
                      or line.startswith("volume_ratio_below_min:")
                      or line.startswith("expectation_proxy_below_threshold:")
                      or line.startswith("DEBUG QUOTE_INFO_RESULT")
                      or line.startswith("DEBUG PROFILE_RESULT")
                      or line.startswith("DEBUG REVENUE_GROWTH_RESULT")
                      or line.startswith("DEBUG MARGIN_RESULT")
                  ):
                      summary_lines.append(line)

          top_df = None
          try:
              top_df = pd.read_csv("top_candidates.csv")
          except Exception:
              top_df = None

          if top_df is None or top_df.empty:
              summary_lines.append("")
              summary_lines.append("No candidates today.")
              message = "\n".join(summary_lines).strip()

              max_len = 3500
              if len(message) <= max_len:
                  send_message(message)
              else:
                  chunks = [message[i:i+max_len] for i in range(0, len(message), max_len)]
                  for chunk in chunks:
                      send_message(chunk)
              raise SystemExit(0)

          keep_cols = [c for c in [
              "ticker",
              "grade",
              "expectation_upgrade_score",
              "guidance_tone_proxy",
              "growth_accel_tag",
              "quality_proxy_tag",
              "score",
              "revenue_growth",
              "ret_6m",
              "ret_3m",
              "high_proximity",
          ] if c in top_df.columns]

          top_df = top_df[keep_cols].head(10).copy()

          summary_lines.append("")
          summary_lines.append("Top Candidates")
          summary_lines.append("")

          for idx, row in top_df.iterrows():
              ticker = str(row.get("ticker", "-"))
              grade = str(row.get("grade", "-"))
              proxy = fmt_num(row.get("expectation_upgrade_score"), 1)
              tone = str(row.get("guidance_tone_proxy", "-"))
              accel = str(row.get("growth_accel_tag", "-"))
              quality = str(row.get("quality_proxy_tag", "-"))
              score = fmt_num(row.get("score"), 1)
              rev = fmt_pct(row.get("revenue_growth"))
              ret6 = fmt_pct(row.get("ret_6m"))
              ret3 = fmt_pct(row.get("ret_3m"))
              prox = fmt_pct(row.get("high_proximity"))

              summary_lines.append(f"{idx+1}. {ticker} | {grade} | score {score} | proxy {proxy}")
              summary_lines.append(f"rev {rev} | 6m {ret6} | 3m {ret3} | high {prox}")
              summary_lines.append(f"tone {tone} | accel {accel} | quality {quality}")
              summary_lines.append("")

          message = "\n".join(summary_lines).strip()

          max_len = 3500
          if len(message) <= max_len:
              send_message(message)
          else:
              chunks = [message[i:i+max_len] for i in range(0, len(message), max_len)]
              for chunk in chunks:
                  send_message(chunk)
          PY

      - name: Show generated files
        if: always()
        run: |
          ls -lah
          echo ""
          echo "eps_candidates.csv"
          test -f eps_candidates.csv && wc -l eps_candidates.csv || true
          echo ""
          echo "top_candidates.csv"
          test -f top_candidates.csv && wc -l top_candidates.csv || true
          echo ""
          echo "ultra_candidates.csv"
          test -f ultra_candidates.csv && wc -l ultra_candidates.csv || true
          echo ""
          echo "multibagger_candidates.csv"
          test -f multibagger_candidates.csv && wc -l multibagger_candidates.csv || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eps-radar-output
          path: |
            eps_radar_run.log
            eps_candidates.csv
            top_candidates.csv
            ultra_candidates.csv
            multibagger_candidates.csv
          if-no-files-found: warn
