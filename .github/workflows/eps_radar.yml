name: Fundamental Direction Radar

on:
  workflow_dispatch:
  schedule:
    - cron: "10 23 * * 0-4"

jobs:
  run-radar:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests

      - name: Validate required files
        run: |
          test -f config.py
          test -f data_client.py
          test -f eps_radar.py
          test -f notifier.py
          test -f data/universe.csv

      - name: Run radar
        run: |
          python eps_radar.py

      - name: Show output preview
        run: |
          echo "===== eps_radar_output.csv ====="
          cat eps_radar_output.csv || true

      - name: Send telegram
        run: |
          python notifier.py

      - name: Upload output artifact
        uses: actions/upload-artifact@v4
        with:
          name: fundamental-direction-radar-output
          path: eps_radar_output.csv
          if-no-files-found: error
