name: Fundamental Direction Radar

on:
  workflow_dispatch:
  schedule:
    # 한국시간 평일 오전 8:10
    # UTC 기준 전일 23:10
    - cron: "10 23 * * 0-4"

jobs:
  run-radar:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests lxml html5lib

      - name: Validate required files
        run: |
          test -f config.py
          test -f data_client.py
          test -f eps_radar.py
          test -f notifier.py
          test -f build_universe.py

      - name: Build universe
        run: |
          mkdir -p data
          python build_universe.py

      - name: Show universe preview
        run: |
          python - <<'PY'
          import pandas as pd
          df = pd.read_csv("data/universe.csv")
          print("===== universe preview =====")
          print("rows:", len(df))
          print(df.head(20).to_string(index=False))
          PY

      - name: Run radar
        run: |
          python eps_radar.py

      - name: Show output preview
        run: |
          python - <<'PY'
          import pandas as pd
          df = pd.read_csv("eps_radar_output.csv")
          print("===== radar output preview =====")
          print("rows:", len(df))
          if len(df) > 0:
              cols = [
                  "ticker",
                  "name",
                  "signal_tier",
                  "total_score",
                  "expectation_upgrade_score",
                  "growth_acceleration_score",
                  "profitability_improvement_score",
                  "valuation_score",
                  "price_position_score",
                  "health_flag",
              ]
              cols = [c for c in cols if c in df.columns]
              print(df[cols].head(20).to_string(index=False))
          else:
              print("Empty output")
          PY

      - name: Send telegram
        run: |
          python notifier.py

      - name: Upload output artifact
        uses: actions/upload-artifact@v4
        with:
          name: fundamental-direction-radar-output
          path: |
            data/universe.csv
            eps_radar_output.csv
          if-no-files-found: error
